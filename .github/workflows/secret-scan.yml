name: Secret scan
# Blocks any PR that introduces an API key pattern — our last line
# of defense before secrets hit the public repo.

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fail the build on any finding.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

  custom-patterns:
    name: Custom patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for high-risk patterns
        run: |
          set -euo pipefail
          # Fail if any of our known key shapes appear outside of docs/examples.
          bad=0
          # Common excludes: this workflow, docs, and the scanner itself.
          COMMON_EXCLUDES=(
            ':!.env.example'
            ':!.github/workflows/secret-scan.yml'
            ':!SECURITY-REVIEW.md'
            ':!SECURITY-SETUP.md'
            ':!scripts/check-secrets.sh'
          )
          # Additional excludes ONLY for the JWT pattern — Supabase anon
          # keys are JWTs and are intentionally public (protected by RLS).
          JWT_EXCLUDES=(
            "${COMMON_EXCLUDES[@]}"
            ':!shared/db.js'
          )
          scan() {
            local label="$1" pattern="$2"
            shift 2
            matches=$(git grep -nE "$pattern" -- "$@" || true)
            if [ -n "$matches" ]; then
              echo "::error::Found $label:"
              echo "$matches"
              bad=1
            fi
          }
          scan "Anthropic key"  'sk-ant-[A-Za-z0-9_-]{20,}'                              "${COMMON_EXCLUDES[@]}"
          scan "OpenAI key"     'sk-[A-Za-z0-9]{40,}'                                    "${COMMON_EXCLUDES[@]}"
          scan "Resend key"     're_[A-Za-z0-9]{20,}'                                    "${COMMON_EXCLUDES[@]}"
          scan "SendGrid key"   'SG\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}'             "${COMMON_EXCLUDES[@]}"
          scan "AWS access key" 'AKIA[0-9A-Z]{16}'                                       "${COMMON_EXCLUDES[@]}"
          scan "JWT (non-anon)" 'eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'  "${JWT_EXCLUDES[@]}"
          if [ $bad -ne 0 ]; then
            echo ""
            echo "Secret-like strings detected. If this is a false positive,"
            echo "rewrite the value (e.g. split or comment it out) or add an"
            echo "exclusion in .github/workflows/secret-scan.yml."
            exit 1
          fi
          echo "No high-risk patterns detected."
